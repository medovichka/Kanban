services:
  nginx:
    build:
      context: ./docker/nginx
    image: ${DOCKERHUB_NAMESPACE}/devops-course-nginx:${IMAGE_TAG}
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./app:/var/www/html:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ${DOCKERHUB_NAMESPACE}/devops-course-php:${IMAGE_TAG}
    environment:
      APP_KEY: ${APP_KEY:-}
      APP_METRICS_ENABLED: ${APP_METRICS_ENABLED:-0}
    volumes:
      - ./app:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  scheduler:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ${DOCKERHUB_NAMESPACE}/devops-course-php:${IMAGE_TAG}
    environment:
      APP_KEY: ${APP_KEY:-}
      APP_METRICS_ENABLED: ${APP_METRICS_ENABLED:-0}
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./docker/scheduler.sh:/usr/local/bin/scheduler.sh:ro
    command: ["sh", "/usr/local/bin/scheduler.sh"]
    restart: unless-stopped

volumes: {}
