services:
  nginx:
    build:
      context: ./docker/nginx
    # build + image одновременно: собирается локально, но с тем же тегом,
    # под которым образ будет виден в `docker images` (пригодится и для CI)
    image: ${DOCKERHUB_NAMESPACE}/devops-course-nginx:${IMAGE_TAG}
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      # Тот же код, что и в php, тем же путём - иначе SCRIPT_FILENAME не совпадёт
      - ./app:/var/www/html:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ${DOCKERHUB_NAMESPACE}/devops-course-php:${IMAGE_TAG}
    volumes:
      # Без :ro - сюда пишет composer install (vendor/) и SQLite-файл БД
      - ./app:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    healthcheck:
      # Дёргаем встроенный ping-эндпоинт php-fpm через FastCGI напрямую, без nginx
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
