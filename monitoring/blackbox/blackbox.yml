modules:
  http_health:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '"status"\s*:\s*"ok"'

  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4

  http_health_strict:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '^\{.*"status"\s*:\s*"ok".*\}$'
      fail_if_body_matches_regexp:
        - '<html'
