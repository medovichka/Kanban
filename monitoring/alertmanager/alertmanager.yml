global:
  smtp_smarthost: mailpit:1025
  smtp_from: alertmanager@devops-course.local
  smtp_require_tls: false

route:
  receiver: team
  group_by: [alertname]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 1h

  routes:
    - matchers:
        - severity = critical
      receiver: oncall

receivers:
  - name: oncall
    email_configs:
      - to: oncall@devops-course.local
        send_resolved: true

  - name: team
    email_configs:
      - to: team@devops-course.local
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - alertname = PostgresDown
    target_matchers:
      - alertname = HealthCheckFailing

  - source_matchers:
      - alertname = ExternalPortDown
    target_matchers:
      - alertname = HealthCheckFailing
