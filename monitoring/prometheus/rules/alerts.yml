groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Target {{ $labels.job }} ({{ $labels.instance }}) недоступен"
          description: "Prometheus не может опросить {{ $labels.instance }} (job={{ $labels.job }}) дольше минуты. Метрики этого компонента не обновляются, алерты по нему не сработают."
          runbook_url: "https://github.com/killo/local_zoo_for_vyatgu/blob/main/runbooks/TargetDown.md"

      - alert: HealthCheckFailing
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Проба {{ $labels.instance }} не проходит"
          description: "blackbox-exporter дольше минуты получает неуспешный ответ от {{ $labels.instance }} (модуль job={{ $labels.job }}). Пользователи, скорее всего, видят ошибку."
          runbook_url: "https://github.com/killo/local_zoo_for_vyatgu/blob/main/runbooks/HealthCheckFailing.md"

  - name: application
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[1m]))
            /
            sum(rate(http_requests_total[1m]))
          ) > 0.05
          and
          sum(rate(http_requests_total[1m])) > 0.2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Доля ошибок 5xx — {{ $value | humanizePercentage }}"
          description: "Больше 5% запросов к приложению завершаются ошибкой 5xx уже 2 минуты (сейчас {{ $value | humanizePercentage }}). Разбивку по route смотрите на дашборде «Обзор сервиса»."
          runbook_url: "https://github.com/killo/local_zoo_for_vyatgu/blob/main/runbooks/HighErrorRate.md"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le, route) (rate(http_request_duration_seconds_bucket[2m]))
          ) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency {{ $labels.route }} — {{ $value | humanizeDuration }}"
          description: "95-й перцентиль времени ответа {{ $labels.route }} выше 1 секунды уже 3 минуты (сейчас {{ $value | humanizeDuration }}). Время ожидания в очереди php-fpm сюда не входит — реальная задержка для пользователя может быть больше."
          runbook_url: "https://github.com/killo/local_zoo_for_vyatgu/blob/main/runbooks/HighLatencyP95.md"

      - alert: PhpFpmPoolSaturated
        expr: |
          phpfpm_listen_queue > 0
          or
          increase(phpfpm_max_children_reached[1m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Пул php-fpm {{ $labels.pool }} исчерпан"
          description: "Все воркеры php-fpm (pm.max_children) заняты, запросы ждут в очереди. Значение: {{ $value }}."
          runbook_url: "https://github.com/killo/local_zoo_for_vyatgu/blob/main/runbooks/PhpFpmPoolSaturated.md"

  - name: postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL недоступен"
          description: "postgres-exporter ({{ $labels.instance }}) не может подключиться к PostgreSQL дольше 30 секунд."
          runbook_url: "https://github.com/killo/local_zoo_for_vyatgu/blob/main/runbooks/PostgresDown.md"

      - alert: PostgresTooManyConnections
        expr: |
          sum by (instance) (pg_stat_activity_count)
          /
          max by (instance) (pg_settings_max_connections)
          > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL: занято {{ $value | humanizePercentage }} соединений"
          description: "Использовано больше 80% max_connections уже 2 минуты (сейчас {{ $value | humanizePercentage }}). Новые подключения скоро начнут отклоняться."
          runbook_url: "https://github.com/killo/local_zoo_for_vyatgu/blob/main/runbooks/PostgresTooManyConnections.md"

  - name: gaps
    rules:
      - alert: ExternalPortDown
        expr: probe_success{job="blackbox-external"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Вход снаружи ({{ $labels.instance }}) не работает"
          description: "Проба через опубликованный на хост порт неуспешна дольше минуты, хотя внутри docker-сети приложение может быть живо. Пользователи не могут открыть сайт."
          runbook_url: "https://github.com/killo/local_zoo_for_vyatgu/blob/main/runbooks/ExternalPortDown.md"

      - alert: ExternalProbe5xx
        expr: probe_http_status_code{job=~"blackbox-.*"} >= 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Проба {{ $labels.instance }} получает {{ $value }}"
          description: "Проба дольше 2 минут получает ответ 5xx. Скорее всего php-fpm отвечает ошибкой или nginx не может до него достучаться."
          runbook_url: "https://github.com/killo/local_zoo_for_vyatgu/blob/main/runbooks/ExternalPortDown.md"

      - alert: AppHealthStale
        expr: up{job="app"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Метрики приложения не обновляются"
          description: "Prometheus не может получить /metrics.php дольше 2 минут. health_check, счётчики сессий и бизнес-метрики на дашборде устарели — графики показывают прошлое, а не текущее состояние."
          runbook_url: "https://github.com/killo/local_zoo_for_vyatgu/blob/main/runbooks/AppHealthStale.md"

      - alert: ContainerRestartLoop
        expr: |
          sum by (container) (changes(container_start_time_seconds{container=~".+"}[10m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Контейнер {{ $labels.container }} перезапускается"
          description: "Больше 3 стартов за 10 минут у {{ $labels.container }}. Даже если он успевает ответить на health-check, при каждом рестарте теряется состояние: сессии в APCu, незавершённые запросы."
          runbook_url: "https://github.com/killo/local_zoo_for_vyatgu/blob/main/runbooks/ContainerRestartLoop.md"

      - alert: ContainerOOMKilled
        expr: sum by (container) (increase(container_oom_events_total{container=~".+"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Контейнер {{ $labels.container }} убит OOM"
          description: "{{ $labels.container }} упёрся в лимит памяти и был убит ядром. Запросы в этот момент падали, данные в памяти (счётчики метрик, php-сессии) потеряны."
          runbook_url: "https://github.com/killo/local_zoo_for_vyatgu/blob/main/runbooks/ContainerRestartLoop.md"
